name: Playwright Tests

# 언제 실행할지: main 브랜치에 push 하거나 PR을 열 때, 그리고 Actions 탭에서 수동 실행
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest   # GitHub가 제공하는 리눅스 가상머신

    steps:
      # 1. 저장소 코드 내려받기
      - uses: actions/checkout@v4

      # 2. Node.js 설치 (+ npm 캐시로 속도 향상)
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # 3. package-lock.json 기준으로 정확히 같은 버전 설치
      - name: Install dependencies
        run: npm ci

      # 4. 브라우저 + 리눅스 시스템 라이브러리 설치
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # 5. 테스트 실행
      - name: Run Playwright tests
        run: npx playwright test

      # 6. 성공/실패와 관계없이 HTML 리포트를 결과물로 업로드
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
