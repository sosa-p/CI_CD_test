<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI 실습 - 할 일 목록</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    li.done span { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>할 일 목록</h1>

  <form id="todo-form">
    <input id="todo-input" placeholder="할 일을 입력하세요" aria-label="할 일 입력">
    <button type="submit">추가</button>
  </form>
  <p id="error" role="alert" hidden>내용을 입력해주세요.</p>

  <ul id="todo-list"></ul>
  <p id="count">남은 할 일: 0개</p>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const count = document.getElementById('count');
    const error = document.getElementById('error');

    function updateCount() {
      const remaining = list.querySelectorAll('li:not(.done)').length;
      count.textContent = `남은 할 일: ${remaining}개`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) { error.hidden = false; return; }
      error.hidden = true;

      const li = document.createElement('li');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', `${text} 완료`);
      checkbox.addEventListener('change', () => {
        li.classList.toggle('done', checkbox.checked);
        updateCount();
      });
      const span = document.createElement('span');
      span.textContent = text;
      li.append(checkbox, ' ', span);
      list.append(li);

      input.value = '';
      updateCount();
    });
  </script>
</body>
</html>
